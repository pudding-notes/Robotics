:root{
  --bg:#F5F0E6;--bg2:#FBF8F2;--bg3:#FFFDF8;--bg4:#F3EBDD;
  --bd:#E6DCCB;--bd2:#D3C3AA;
  --tx:#24170E;--tx2:#4F3D2E;--tx3:#7C6652;
  --or:#D97757;--orD:#9A3F1E;--orL:#FBE9DF;--teal:#2F8F7A;--tealL:#DDF0E9;--blue:#4A78B8;--amber:#C98A1E;
  --font:'Galmuri11',system-ui,sans-serif;
  --mono:'GalmuriMono11','Galmuri11',ui-monospace,monospace;
  --rw:384px;--spd:1;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}
html,body{height:100%}
:root{color-scheme:light}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px;line-height:1.7;overflow:hidden;-webkit-font-smoothing:none}
b,strong{font-weight:700}
header{height:64px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:3px solid var(--tx);background:#FBF3E4}
.brand{white-space:nowrap}
.brand b{display:block;font-family:'Galmuri14',var(--font);font-size:22px;line-height:1.15;color:var(--orD);font-weight:400}
.brand span{font-size:13px;color:var(--tx3)}
nav{display:flex;gap:5px;overflow-x:auto;flex:1;padding:6px 4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;display:flex;align-items:center;gap:5px;font:inherit;font-size:13px;padding:4px 10px;cursor:pointer;white-space:nowrap;border:2px solid var(--tx);box-shadow:2px 2px 0 var(--tx);background:#FFFBF2;color:var(--tx)}
nav button i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--tx3)}
nav button:hover{background:var(--orL)}
nav button.on{background:var(--or);color:#FFF8F0}
nav button.on i{color:#FFE3D4}
nav .sep{flex:none;color:var(--bd2);font-size:11px;align-self:center}
header .qzOpen{flex:none;background:var(--or);color:#FFF8F0;font-family:'Galmuri14',var(--font);font-size:13px}
main{height:calc(100% - 64px)}
.stage{position:relative;height:100%;overflow:hidden;background-color:#F4ECDD;background-image:linear-gradient(90deg,rgba(61,43,31,.055) 2px,transparent 2px),linear-gradient(rgba(61,43,31,.055) 2px,transparent 2px);background-size:24px 24px}
#sv{position:absolute;left:0;top:44px;right:var(--rw);bottom:80px;width:calc(100% - var(--rw));height:calc(100% - 124px);display:block;user-select:none;text-rendering:optimizeSpeed}
#sv text{font-family:var(--font);paint-order:stroke fill;stroke:#FBF6EC;stroke-width:.32em;stroke-linejoin:miter}
#sv text.mono{font-family:var(--mono)}
#sv text.big{font-family:'Galmuri14',var(--font)}
#sv text.nh{stroke:none}
#gl{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0;pointer-events:none}
#j3l{position:absolute;inset:0;pointer-events:none;z-index:3}
.jb{position:absolute;width:24px;height:24px;border:2px solid var(--tx);box-shadow:2px 2px 0 var(--tx);color:#FFF8F0;font-family:var(--mono);font-size:14px;line-height:20px;text-align:center}
#ptr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.scope{position:absolute;left:16px;top:12px;font-size:14px;color:var(--tx2);border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:#FFFBF2;padding:4px 12px;pointer-events:none;z-index:4;max-width:calc(100% - var(--rw) - 30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope b{color:var(--tx)}
.scope small{color:var(--tx3);margin-left:6px;font-size:13px}
/* guide + bubble */
.guide{position:absolute;left:40px;top:70px;width:0;height:0;pointer-events:none;z-index:8}
.guide svg{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0;filter:drop-shadow(3px 3px 0 rgba(61,43,31,.35));shape-rendering:crispEdges}
.guide.o1 svg{transform:scaleX(-1)}
.guide .ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:3px solid var(--or);opacity:0}
.guide.click .ring{animation:ringpx calc(.6s / var(--spd)) steps(18)}
@keyframes ringpx{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8);opacity:0}}
.guide.idle svg{animation:wigpx calc(1.4s / var(--spd)) steps(42) infinite}
@keyframes wigpx{50%{translate:3px 3px}}
.bub{position:absolute;left:110px;top:60px;width:360px;border:3px solid var(--tx);box-shadow:6px 6px 0 var(--or);background:#FFFBF2;font-family:'Galmuri14',var(--font);font-size:17px;line-height:1.8;padding:13px 17px;color:var(--tx);z-index:6;visibility:hidden}
.bub b{color:var(--orD);font-weight:400}
.bub .gap{display:block;height:.6em}
.bub .ol{display:block;margin-top:6px;line-height:1.9}
.bub .ghint{display:block;margin-top:8px;font-family:var(--font);font-size:13px;color:var(--tx2);border-top:2px dashed var(--bd2);padding-top:6px}
.bub .ghint b{color:var(--orD);font-weight:700}
.bub .k{font-family:var(--mono);font-size:13px;background:#F4ECDF;padding:0 4px}
.bub .ca{color:var(--orD)}.bub .cb{color:var(--teal)}
/* bar */
.bar{position:absolute;left:12px;right:12px;bottom:10px;min-height:56px;display:flex;align-items:center;gap:7px;padding:8px 10px;border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FBF3E4;z-index:7;overflow-x:auto}
.bar .bpos{font-family:var(--mono);font-size:14px;color:var(--tx2);min-width:46px;text-align:center}
.bar .sep{width:2px;align-self:stretch;background:var(--bd2);margin:0 4px;flex:none}
.bar .simLab{font-size:13px;color:var(--tx3);white-space:nowrap}
.simBtns{display:flex;gap:6px;flex-wrap:nowrap}
button.btn{border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:#FFFBF2;color:var(--tx);font:inherit;font-size:14px;padding:7px 13px;cursor:pointer;line-height:1.3;white-space:nowrap;flex:none}
button.btn:hover{background:var(--orL)}
button.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tx)}
button.btn.pri{background:var(--or);color:#FFF8F0}
button.btn.pri:hover{background:#C9663F}
button.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
button.btn.sm{padding:6px 11px;font-size:13px}
.btn.pulse{animation:bpx calc(1s / var(--spd)) steps(30) infinite}
@keyframes bpx{50%{box-shadow:3px 3px 0 var(--tx),0 0 0 4px var(--or)}}
#bAuto.on{background:var(--orL);color:var(--orD)}
.spd{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--tx2);flex:none;padding-left:8px}
.spd input{-webkit-appearance:none;appearance:none;width:90px;height:10px;background:var(--bg4);border:2px solid var(--tx);outline:none}
.spd input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:18px;background:var(--or);border:2px solid var(--tx);cursor:pointer}
.spd input::-moz-range-thumb{width:10px;height:16px;background:var(--or);border:2px solid var(--tx);border-radius:0;cursor:pointer}
.spd b{font-family:var(--mono);color:var(--orD);min-width:22px}
/* right cards */
#rcol{position:absolute;right:16px;top:12px;width:calc(var(--rw) - 34px);display:flex;flex-direction:column;gap:10px;z-index:4;max-height:calc(100% - 100px)}
.hc{position:relative;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FFFBF2}
.hcBtn{flex:none;width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:none;font:inherit;font-size:14px;color:var(--tx);padding:9px 12px;cursor:pointer;text-align:left}
.hcBtn .cnt{font-family:var(--mono);font-size:13px;color:var(--or)}
.hcBtn .chev{margin-left:auto;color:var(--tx3)}
.hc.open .chev{transform:rotate(180deg)}
.pill{font-family:'Galmuri9',var(--font);font-size:10px;padding:0 6px;background:var(--or);color:#FFF8F0;border:2px solid var(--tx);display:none}
.pill.show{display:inline-block;animation:blinkpx calc(1.2s / var(--spd)) steps(36) infinite}
@keyframes blinkpx{50%{opacity:.35}}
.hcBody{display:none;padding:6px 12px 12px;border-top:2px solid var(--tx);overflow-y:auto;min-height:0}
.hc.open .hcBody{display:block}
.hcNote{font-size:13px;color:var(--tx2);margin-top:8px;line-height:1.6}
.kg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:4px}
.kgL{grid-column:1/-1;font-size:12px;color:var(--tx3);margin-top:6px}
.kf{border:2px dashed #D9CBB4;padding:3px 2px;min-height:38px;background:var(--bg4);text-align:center}
.kf .n{font-family:'Galmuri11',var(--font);font-size:11px;color:var(--tx3);line-height:1.3}
.kf .v{font-family:var(--mono);font-size:15px;color:#B9A78F;line-height:1.5}
.kf.on{border:2px solid var(--tx);background:#FFFDF8}.kf.on .v{color:var(--tx)}
.kf.a{border:2px solid var(--tx);background:var(--orL)}.kf.a .v{color:var(--orD)}.kf.a .n{color:#A9573A}
.kf.b{border:2px solid var(--tx);background:var(--tealL)}.kf.b .v{color:#22705F}.kf.b .n{color:#22705F}
.kf.new{box-shadow:2px 2px 0 var(--or)}

/* ===== 3D 도구 · PUMA 560 (three.js → 픽셀 렌더) ===== */
const V3={add:(a,b,k)=>{k=k===undefined?1:k;return [a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k];},cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],

function rX(d){const a=d*D2R,c=Math.cos(a),s=Math.sin(a);return [[1,0,0],[0,c,-s],[0,s,c]];}
function rY(d){const a=d*D2R,c=Math.cos(a),s=Math.sin(a);return [[c,0,s],[0,1,0],[-s,0,c]];}
function rZ(d){const a=d*D2R,c=Math.cos(a),s=Math.sin(a);return [[c,-s,0],[s,c,0],[0,0,1]];}
/* PUMA 560 비율: 몸통 높이 · 어깨 옆 오프셋 · 위팔 a₂ · 아래팔 d₄ */
const ARM={H0:220,D:78,DZ3:-44,L2:215,L3:205,Lg:80,OFF:0};

  const Rf3=M3mul(F1,rZ(q.t2+q.t3)),u3=M3v(Rf3,[1,0,0]),W4=V3.add(V3.add(E,u3,ARM.L3),z1,ARM.DZ3);
  const R4=M3mul(Rf3,rX(q.t4)),R5=M3mul(R4,rZ(q.t5)),R6=M3mul(R5,rX(q.t6));
  const W=V3.add(W4,M3v(R4,[0,0,ARM.OFF]));
  const u6=M3v(R6,[1,0,0]),Gp=V3.add(W,u6,ARM.Lg);
  return {S,E,W,W4,G:Gp,F1,z1,Rf3,R4,R5,R6,u3,u6,ax:[[0,1,0],z1,z1,u3,M3v(R4,[0,0,1]),u6]};}
function ik3(W,up){const dT=ARM.D+ARM.DZ3,phi=Math.atan2(-W[2],W[0]),rho2=W[0]*W[0]+W[2]*W[2],r=Math.sqrt(Math.max(1,rho2-dT*dT));

[1,null,1,'목표 자세 ⁰₆T에는 위치 3개와 방향 3개, 총 6개의 독립된 정보가 들어 있다.','위치는 x, y, z 3개, 방향은 각도 3개(예: RPY)로 표현할 수 있어서 합쳐 6개예요.'],
[1,null,0,'⁰₆T의 회전 부분은 3×3 = 9칸이므로 방향 정보도 9개다.','9칸이지만 서로 묶여 있어요. 각 열은 길이 1, 서로 수직이라는 조건 때문에 실제로 자유로운 값은 3개뿐이에요.'],
[1,null,1,'6축 로봇의 역기구학은 미지수 6개(θ₁ ~ θ₆)를 구하는 문제다.','주어진 정보 6개와 미지수 6개가 짝이 맞아요.'],
[1,null,1,'순기구학 ⁰₆T는 링크 변환 행렬 6개를 차례로 곱한 식이다.','⁰₆T = ⁰₁T ¹₂T ²₃T ³₄T ⁴₅T ⁵₆T. 앞의 셋을 곱하면 ⁰₃T, 뒤의 셋을 곱하면 ³₆T예요.'],
[1,null,0,'순기구학 식의 각 원소에는 보통 관절 각도가 하나씩만 들어 있다.','여러 각도가 곱으로 섞여 있어요. PUMA ⁰₃T의 c₁c₂₃처럼 θ₁, θ₂, θ₃가 한 칸에 같이 들어가요.'],
[1,null,1,'역기구학이 어려운 이유 중 하나는 sin·cos가 들어간 비선형 방정식이라 소거법으로 깔끔하게 풀리지 않기 때문이다.','일차 연립방정식이라면 가우스 소거법으로 항상 풀리지만, 삼각함수가 곱으로 섞이면 일반적인 풀이법이 없어요.'],
[1,null,0,'일반적인 6축 로봇은 항상 닫힌 형태(식으로 바로 나오는) 해가 있다.','일반 6축 로봇은 닫힌 해가 없어요(Ch3 p.7). 특별한 구조일 때만 식으로 풀리고, Pieper가 그 대표적인 경우예요.'],
[1,null,0,'역기구학의 해는 항상 정확히 하나다.','해가 없을 수도(작업 공간 밖), 여러 개일 수도(팔꿈치 위·아래, 손목 뒤집기) 있어요. PUMA 560은 최대 8개예요.'],
[1,null,1,'순기구학은 관절 각도를 넣으면 손끝 자세가 하나로 정해진다.','행렬을 곱하기만 하면 되니까 항상 답이 하나예요. 어려운 건 거꾸로 가는 역기구학이에요.'],
[1,'확인',1,'Pieper 방법의 핵심은 6개짜리 엉킨 문제를 3개짜리 문제 두 개로 쪼개는 것이다.','θ₁–θ₃로 위치를 맞추는 문제와 θ₄–θ₆로 방향을 맞추는 문제로 나눠요.'],
[1,null,0,'Pieper 방법에서 앞의 세 관절(θ₁–θ₃)은 방향을, 뒤의 세 관절(θ₄–θ₆)은 위치를 맞춘다.','반대예요. 앞 세 관절(팔)이 손목 중심의 위치를, 뒤 세 관절(손목)이 그리퍼의 방향을 맞춰요.'],
/* ===== 2단계: 손목 중심 ===== */
[2,'확인',1,'{3}의 원점이 관절 3 축 위에 있으면, ⁰₃T의 마지막 열(위치)에는 θ₃가 들어 있지 않다.','θ₃는 {3}의 방향만 바꾸고 원점은 못 옮겨요. 그래서 θ₃는 위치가 아니라 회전 행렬 ⁰₃R에서 구해야 해요.'],
[2,null,1,'{3}의 원점은 관절 3의 회전축 위에 있어서, θ₃를 돌려도 {3}의 위치는 변하지 않는다.','회전축 위의 점은 그 축으로 돌려도 제자리예요. θ₃는 {3}의 방향만 바꿔요.'],
[2,null,0,'관절을 돌리면 그 관절의 회전축 위에 있는 점도 원을 그리며 움직인다.','회전축 위의 점은 반지름이 0인 원을 그려요. 즉 움직이지 않아요.'],
[2,null,1,'어떤 점이 관절 축 위에 있으면, 그 관절은 그 점의 위치를 바꾸지 못한다.','Pieper 2단계 전체가 이 한 문장에서 나와요.'],
[2,null,1,'손목 중심은 손목 관절 4, 5, 6의 축이 모두 지나는 한 점이다.','PUMA 렌더링의 초록 점, Ch3 p.14 그림의 Wrist Center Point예요.'],
[2,null,0,'손목 중심의 위치는 θ₁부터 θ₆까지 여섯 각도 모두에 따라 달라진다.','손목 중심은 축 4, 5, 6 위에 있어서 θ₄, θ₅, θ₆로는 움직이지 않아요. 그래서 θ₁, θ₂, θ₃에만 달려 있어요.'],
[2,'확인',1,'손목 세 축이 한 점에서 만나면, 손목 중심의 위치는 θ₁, θ₂, θ₃만으로 정해진다.','규칙을 세 번 적용한 결과예요. θ₄로도, θ₅로도, θ₆로도 손목 중심은 안 움직여요.'],
[2,null,1,'θ₄–θ₆를 돌리면 그리퍼의 방향은 바뀌지만 손목 중심의 위치는 그대로다.','그래서 손목은 방향 담당, 팔(θ₁–θ₃)은 위치 담당으로 역할이 나뉘어요.'],
[2,null,0,'손목 세 축 중 두 축만 한 점에서 만나도 Pieper 방법으로 위치와 방향을 분리할 수 있다.','세 축이 모두 같은 점을 지나야 해요. 한 축이라도 그 점을 비켜 가면 그 관절을 돌릴 때 점이 움직여서 위치에 θ가 섞여요.'],
[2,null,1,'손목 축에 오프셋이 있으면 손목을 돌릴 때 기준점이 같이 움직여서, 위치 식에도 θ₄–θ₆가 섞인다.','그러면 문제를 3개 + 3개로 쪼갤 수 없어요. Pieper 방법은 이 구조의 로봇에서만 쓸 수 있어요.'],
[2,null,1,'산업용 로봇 대부분이 손목 세 축을 한 점에 모이게 설계하는 이유 중 하나는 역기구학을 식으로 풀 수 있게 하기 위해서다.','Ch3 p.7: 닫힌 해가 나오도록 로봇을 설계하는 것이 중요하다 → 이웃한 세 축이 한 점에서 만나는 6자유도 로봇.'],
[2,null,1,'PUMA의 ³₆T에서 위치 열이 (a₃, d₄, 0)으로 θ₄–θ₆ 없이 나온 것은 손목 세 축이 한 점에서 만나기 때문이다.','{4}, {5}, {6}의 원점이 모두 손목 중심이라 손목 각도가 위치에 안 들어가요.'],
[2,null,0,'문제 A(θ₁–θ₃로 위치 맞추기)를 풀려면 θ₄–θ₆ 값을 먼저 알아야 한다.','손목 중심 위치 식에는 θ₄–θ₆가 아예 없어서 몰라도 돼요. 이게 쪼개기의 핵심이에요.'],
[2,null,1,'문제 A를 풀고 나면 θ₁–θ₃가 숫자가 되어, 문제 B에는 θ₄–θ₆만 남는다.','자물쇠 두 개를 차례로 여는 것과 같아요. 첫 번째 자물쇠는 두 번째를 몰라도 열려요.'],
[2,null,0,'손목 중심은 항상 그리퍼 끝점과 같은 위치다.','보통은 그리퍼 끝이 손목 중심보다 앞(도구 길이만큼)에 있어요. 도구 길이가 0일 때만 같아요. 손목 중심을 구하는 법이 3단계예요.']
];
Q.push(
[4,'확인',1,'4단계에서는 θ₁, θ₂, θ₃를 한꺼번에 풀지 않고 θ₃ → θ₂ → θ₁ 순서로 하나씩 푼다.','미지수를 하나씩 줄여 가요. 거리로 θ₃, 높이로 θ₂, 방향으로 θ₁.'],
[4,null,1,'θ₂만 돌리면 손목 중심의 좌표는 바뀌지만 어깨에서의 거리는 그대로다.','어깨 관절은 팔을 통째로 돌리기만 해요. 길이는 안 변해요.'],
[4,null,0,'몸통(θ₁)만 돌리면 손목 중심의 x, y, z가 모두 그대로다.','x, y는 세로축 둘레 원을 따라 바뀌어요. 그대로인 건 높이 z와 거리예요.'],
[4,'확인',1,'높이 z 식에는 θ₁이 들어 있지 않다.','세로축으로 도는 회전은 높이를 바꾸지 않아요.'],
[4,null,0,'θ₃를 구할 때는 손목 중심의 높이 z만 있으면 된다.','θ₃는 거리 r = x² + y² + z²으로 구해요. 세 좌표가 모두 필요해요.'],
[4,null,1,'거리 식에서 θ₃가 보통 두 개 나오는데, 이는 팔꿈치 위 · 아래 두 자세에 해당한다.','A cosθ₃ + B sinθ₃ = C를 반각 치환으로 풀면 해가 두 개예요.'],
[4,'확인',0,'손목 중심이 (0, 200, 300)이면 θ₁ = tan⁻¹(300/200)이다.','θ₁은 위에서 본 방향이라 z를 안 써요. atan2(200, 0) = 90°예요.'],
[4,null,1,'손목 중심이 (100, 100, 500)이고 오프셋이 없으면 θ₁ = 45°이고, z = 500은 θ₁ 계산에 쓰이지 않는다.','atan2(100, 100) = 45°. z는 높이 정보라 θ₂ 쪽에 쓰여요.'],
[4,null,1,'atan2는 x = 0이어도 각도를 계산할 수 있지만, tan⁻¹(y/x)는 0으로 나누게 된다.','atan2(200, 0) = 90°처럼 바로 나와요. 사분면도 구분해요.'],
[4,null,0,'z 식으로 θ₂를 구할 때 θ₃는 아직 모르는 값이다.','θ₃는 거리로 이미 구했어요. 그래서 z 식에 θ₂만 남아요.'],
[4,null,1,'⁰P₄ORG는 {4}의 원점 위치로, 손목 중심과 같은 점이다.','{4}, {5}, {6}의 원점이 모두 손목 중심에 있어요. ⁰₄T(자세 전체)와 달리 점 하나의 위치예요.'],
[4,'확인',0,'⁰P₄ORG를 구하려면 θ₄가 필요하다.','{4}의 원점은 축 ④ 위에 있어서 θ₄로 움직이지 않아요. ³₄T의 4열에 θ₄가 없어요.'],
[4,null,1,'f₁, f₂, f₃는 ²₃T · ³P₄ORG의 결과에 붙인 이름이고 θ₃만 포함한다.','²₃T에는 θ₃만 있고, ³P₄ORG는 상수예요.'],
[4,null,1,'g = ¹₂T · f 이므로 g₁, g₂, g₃에는 θ₂와 θ₃만 들어 있다.','¹₂T에는 θ₂만, f에는 θ₃만 있어요. 재료에 없는 θ는 곱해도 생기지 않아요.'],
[4,null,1,'k₁ ~ k₄는 모두 θ₃만의 식이다.','k₁ = f₁, k₂ = −f₂, k₃, k₄도 f와 상수로만 되어 있어요.'],
[4,'확인',0,'a₁도 0이 아니고 sα₁도 0이 아니면 θ₃를 구할 수 없다.','구할 수는 있어요. 두 식을 제곱해 더해 θ₂를 지우면 θ₃의 4차 방정식이 돼요. 다만 계산이 무거워요.'],
[5,'확인',1,'³₆R = (⁰₃R)ᵀ ⁰₆R 에서 오른쪽 두 행렬은 5단계 시점에 모두 숫자다.','⁰₆R은 목표로 주어지고, ⁰₃R은 4단계에서 구한 θ₁ ~ θ₃로 계산돼요.'],
[5,null,0,'(⁰₃R)⁻¹을 구하려면 3×3 역행렬을 직접 계산해야 한다.','회전 행렬은 역행렬 = 전치예요. 행과 열만 바꾸면 돼요.'],
[5,null,1,'³₆R은 Z-Y-Z 오일러 각 행렬과 같은 꼴이고, θ₄ = α, θ₅ = β, θ₆ = γ에 대응한다.','손목 축이 ④ Z → ⑤ 새 Y → ⑥ 새 Z 순서로 돌기 때문이에요 (p.21).'],
[5,'확인',1,'손목 각도는 θ₅부터 구한다. r₃₃ = cosθ₅처럼 θ₅만 들어 있는 칸이 있기 때문이다.','θ₅ = atan2(√(r₃₁² + r₃₂²), r₃₃). 그다음 θ₄, θ₆을 읽어요.'],
[5,null,1,'(θ₄ + 180°, −θ₅, θ₆ + 180°)도 같은 그리퍼 자세를 만든다.','손목 뒤집기예요. 그래서 PUMA는 팔꿈치 2 × 어깨 2 × 손목 2 = 최대 8개 해가 있어요.'],
[5,null,0,'θ₅ = 0이면 θ₄와 θ₆이 각각 하나로 정해진다.','축 ④와 ⑥이 겹쳐서 합 θ₄ + θ₆만 정해져요. 특이점이에요.'],
[5,null,1,'³₆R = I이면 θ₅ = 0이고 θ₄ + θ₆ = 0이다.','r₃₃ = 1 → θ₅ = 0, r₁₁ = 1, r₁₂ = 0 → θ₄ + θ₆ = atan2(0, 1) = 0°.']);
Q.push(
[3,'확인',0,'Pieper 역기구학에서 문제로 직접 주어지는 것은 손목 중심의 위치다.','주어지는 건 그리퍼 끝(도구 끝) 자세 ⁰₆T예요. 손목 중심은 거기서 계산해서 꺼내요.'],
[3,null,1,'목표 자세 ⁰₆T는 Ch1에서 배운 동차 변환 행렬과 같은 모양이다.','회전 R과 위치 P를 담은 4×4, 마지막 행 (0, 0, 0, 1)이에요. {6}을 {0}에서 본 모습이에요.'],
[3,'확인',1,'⁰₆T 회전 부분의 3열은 Ẑ₆, 즉 그리퍼가 뻗는 방향을 바닥 {0} 기준으로 나타낸다.','회전 행렬의 각 열은 {6}의 축 단위벡터를 {0}에서 본 거예요. 1열 X̂₆, 2열 Ŷ₆, 3열 Ẑ₆.'],
[3,null,0,'⁰₆T의 4열(위치)에는 언제나 손목 중심의 좌표가 들어 있다.','4열은 그리퍼 끝 원점 ⁰P₆ORG예요. 도구 길이 d가 0일 때만 손목 중심과 같아요.'],
[3,null,0,'손목 중심을 구하려면 θ₁ ~ θ₃를 먼저 알아야 한다.','3열과 4열 모두 목표로 주어진 숫자라 θ가 하나도 필요 없어요. 그래서 θ를 구하기 전에 먼저 할 수 있어요.'],
[3,'확인',1,'손목 중심 = 그리퍼 끝 − d × (3열) 이다.','그리퍼 방향의 반대로 도구 길이 d만큼 되돌아간 점이에요.'],
[3,null,0,'d × (3열)은 내적이라서 결과가 숫자 하나다.','스칼라 곱이에요. 숫자 × 벡터라 결과는 벡터예요. 내적은 벡터 · 벡터 → 숫자.'],
[3,null,1,'그리퍼가 아래(0, 0, −1)를 보고 끝이 (500, 200, 300), d = 100이면 손목 중심은 (500, 200, 400)이다.','(500, 200, 300) − 100 × (0, 0, −1) = (500, 200, 400). 아래를 보니까 손목은 위에 있어요.'],
[3,null,0,'그리퍼가 +x(1, 0, 0)를 보고 끝이 (600, 0, 300), d = 80이면 손목 중심은 (680, 0, 300)이다.','빼야 해요. (600, 0, 300) − (80, 0, 0) = (520, 0, 300). 더하면 그리퍼 앞쪽으로 가 버려요.'],
[3,null,1,'PUMA의 D-H처럼 {4}, {5}, {6}의 원점이 모두 손목 중심에 있으면 ⁰₆T의 4열이 곧 손목 중심이다.','d = 0이라서 빼 줄 게 없어요.'],
[3,null,0,'그리퍼를 기울이면 손목 중심 공식이 달라진다.','같은 식 p − d × (3열) 그대로예요. 기울기는 3열 값에 이미 들어 있어요.'],
[3,null,1,'3단계에서 구한 손목 중심 (x, y, z)는 4단계에서 팔 세 관절이 맞춰야 할 목표 숫자가 된다.','이 숫자가 정해져야 4단계(θ₃ → θ₂ → θ₁)를 시작할 수 있어요. 4단계에서는 이 점을 ⁰P₄ORG라고 불러요.']);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let wrong=new Set(store.get('pieperj.wrong',[]).filter(i=>i<Q.length));
const QS={units:new Set([1,2,3,4,5]),mode:'seq',list:[],i:0,ok:0,bad:[],answered:false};
const qzB=$('qzBody');
function qzOpen(){$('qz').classList.add('on');qzSetup();}
function qzClose(){$('qz').classList.remove('on');}
$('qzOpen').onclick=qzOpen;$('qzX').onclick=qzClose;
function qzSetup(){const cnt=u=>Q.filter(q=>q[0]===u).length;
  qzB.innerHTML='<h3 class="qzH">Pieper OX 퀴즈<small>'+Q.length+'문제 · 1 ~ 5단계</small></h3>'+
  '<div class="qzL">범위</div><div class="qzChips">'+[1,2,3,4,5].map(u=>'<button class="qzC'+(QS.units.has(u)?' on':'')+'" data-u="'+u+'">'+QSTEP[u]+'<small>'+cnt(u)+'</small></button>').join('')+'</div>'+
  '<div class="qzL">방식</div><div class="qzChips">'+[['seq','설명 순서대로'],['rnd','섞어서'],['chk','확인 질문만'],['bad','틀린 문제만']].map(([k,l])=>'<button class="qzC'+(QS.mode===k?' on':'')+'" data-m="'+k+'"'+(k==='bad'&&!wrong.size?' disabled':'')+'>'+l+(k==='bad'?'<small>'+wrong.size+'</small>':'')+'</button>').join('')+'</div>'+
  '<div class="qzNote">설명에서 다룬 내용만 나와요. 틀린 문제는 이 브라우저에 모아 둬요.</div>'+
  '<div class="qzRow end"><button class="btn" id="qzClr"'+(wrong.size?'':' disabled')+'>틀린 기록 지우기</button><button class="btn pri" id="qzGo">시작 ▶</button></div>';
  qzB.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=+b.dataset.u;if(QS.units.has(u)&&QS.units.size>1)QS.units.delete(u);else QS.units.add(u);qzSetup();});
  qzB.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{QS.mode=b.dataset.m;qzSetup();});
  $('qzClr').onclick=()=>{wrong.clear();store.set('pieperj.wrong',[]);qzSetup();};
  $('qzGo').onclick=qzStart;}
function qzStart(){let l=Q.map((q,i)=>i).filter(i=>QS.units.has(Q[i][0]));
  if(QS.mode==='chk')l=l.filter(i=>Q[i][1]);if(QS.mode==='bad')l=l.filter(i=>wrong.has(i));
  if(QS.mode==='rnd'||QS.mode==='bad')for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]];}
  if(!l.length){qzSetup();return;}QS.list=l;QS.i=0;QS.ok=0;QS.bad=[];qzQ();}
function qzQ(){const qi=QS.list[QS.i],q=Q[qi];QS.answered=false;
  qzB.innerHTML='<div class="qzTop"><span class="qzU">'+QSTEP[q[0]]+'</span>'+(q[1]?'<span class="qzQ">확인 질문</span>':'')+'<span class="qzP">'+(QS.i+1)+' / '+QS.list.length+'</span></div>'+
  '<div class="qzBarO"><i style="width:'+(QS.i/QS.list.length*100)+'%"></i></div><div class="qzS">'+q[3]+'</div>'+
  '<div class="qzOX"><button class="qzB o" data-a="1">O<small>맞다</small></button><button class="qzB x" data-a="0">X<small>틀리다</small></button></div><div id="qzFb"></div>';
  qzB.querySelectorAll('.qzB').forEach(b=>b.onclick=()=>qzAns(+b.dataset.a));}
function qzAns(a){if(QS.answered)return;QS.answered=true;const qi=QS.list[QS.i],q=Q[qi],ok=a===q[2];
  if(ok){QS.ok++;wrong.delete(qi);}else{QS.bad.push(qi);wrong.add(qi);}store.set('pieperj.wrong',[...wrong]);
  qzB.querySelectorAll('.qzB').forEach(b=>{b.disabled=true;const v=+b.dataset.a;if(v===q[2])b.classList.add('ans');else if(v===a)b.classList.add('no');});
  $('qzFb').innerHTML='<div class="qzFb '+(ok?'ok':'ng')+'"><b>'+(ok?'정답!':'아쉬워요. 정답은 '+(q[2]?'O':'X'))+'</b><p>'+q[4]+'</p></div><div class="qzRow end"><button class="btn pri" id="qzN">'+(QS.i<QS.list.length-1?'다음 문제 ▶':'결과 보기')+'</button></div>';
  $('qzN').onclick=()=>{QS.i++;if(QS.i<QS.list.length)qzQ();else qzEnd();};$('qzN').focus();}
function qzEnd(){const n=QS.list.length;
  qzB.innerHTML='<h3 class="qzH">결과</h3><div class="qzScore"><b>'+QS.ok+'</b> / '+n+'<small>'+Math.round(QS.ok/n*100)+'%</small></div>'+
  (QS.bad.length?'<div class="qzL">틀린 문제</div><div class="qzList">'+QS.bad.map(i=>{const q=Q[i];return '<div class="qzI"><div class="qzIt"><span class="qzU">'+QSTEP[q[0]]+'</span><b class="'+(q[2]?'o':'x')+'">'+(q[2]?'O':'X')+'</b></div><p>'+q[3]+'</p><p class="qzE">'+q[4]+'</p></div>';}).join('')+'</div>':'<div class="qzNote">전부 맞혔어요!</div>')+
  '<div class="qzRow end">'+(QS.bad.length?'<button class="btn" id="qzR">틀린 것만 다시</button>':'')+'<button class="btn" id="qzS">처음 화면</button><button class="btn pri" id="qzC">여정으로 돌아가기</button></div>';
  if($('qzR'))$('qzR').onclick=()=>{QS.list=QS.bad.slice();QS.i=0;QS.ok=0;QS.bad=[];qzQ();};
  $('qzS').onclick=qzSetup;$('qzC').onclick=qzClose;}
document.addEventListener('keydown',e=>{if(!$('qz').classList.contains('on'))return;if(e.key==='Escape')qzClose();
  if(!QS.answered&&qzB.querySelector('.qzB')){if(e.key==='o'||e.key==='O'||e.key==='1')qzAns(1);if(e.key==='x'||e.key==='X'||e.key==='2')qzAns(0);}});

kcState(0);renderCards();go(0);
</script>
</body>
</html>
