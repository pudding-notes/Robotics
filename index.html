<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robotics 학습 노트</title>
<style>
:root{--bg:#F5F0E6;--card:#FFFBF2;--tx:#24170E;--tx2:#4F3D2E;--tx3:#7C6652;--or:#D97757;--orD:#9A3F1E;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.7;padding:40px 16px;
  background-image:linear-gradient(90deg,rgba(61,43,31,.055) 2px,transparent 2px),linear-gradient(rgba(61,43,31,.055) 2px,transparent 2px);background-size:24px 24px}
main{max-width:760px;margin:0 auto}
h1{font-size:28px;color:var(--orD);margin-bottom:4px}
.sub{color:var(--tx3);margin-bottom:28px}
h2{font-size:18px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h2 span{font-size:12px;background:var(--tx);color:#FFF8F0;padding:1px 8px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--tx);box-shadow:5px 5px 0 var(--tx);padding:14px 18px;margin-bottom:14px}
a.card:hover{background:#FBE9DF}
a.card:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--tx)}
a.card b{display:block;font-size:17px;color:var(--orD)}
a.card p{font-size:14px;color:var(--tx2)}
footer{margin-top:32px;font-size:12px;color:var(--tx3)}
</style>
</head>
<body>
<main>
  <h1>Robotics 학습 노트</h1>
  <p class="sub">좌표 변환 · 순기구학 · 역기구학 강의를 따라가며 만든 인터랙티브 페이지 모음</p>

  <h2><span>bae</span>배정훈</h2>
  <a class="card" href="bae/pieper_journey.html">
    <b>Pieper의 여정 · 6축 역기구학 쪼개기</b>
    <p>PUMA 560 픽셀 3D 렌더링으로 Pieper 방법을 1부 직관 → 2부 수식(Ch3 p.14–21) 순서로 따라가는 페이지</p>
  </a>
  <a class="card" href="bae/robotics_ch1-3.html">
    <b>Ch1–Ch3 총정리</b>
    <p>좌표 변환, D-H 파라미터, 순기구학, 역기구학 전체 복습 사이트</p>
  </a>

  <footer>3D 장면은 three.js를 인터넷에서 불러오므로 온라인에서 열어 주세요.</footer>
</main>
</body>
</html>
